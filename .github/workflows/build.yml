name: build

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2
      - name: Build x64 Release (user-mode; filter is WDK-only and not in this solution)
        run: msbuild SmoothPad.sln /m /p:Configuration=Release /p:Platform=x64
      - name: Test
        run: .\out\x64\Release\SmoothPad.Tests.exe
